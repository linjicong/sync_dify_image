name: Sync Docker Images to Alibaba Cloud from Docker Compose

on:
  push:
    branches:
      - main

jobs:
  sync-images:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code from Dify repo
      uses: actions/checkout@v3
      with:
        repository: langgenius/dify
        path: dify-repo
        ref: 1.19.0

        
    - name: Install yq
      run: |
        sudo wget https://github.com/mikefarah/yq/releases/download/v4.27.3/yq_linux_amd64 -O /usr/bin/yq
        sudo chmod +x /usr/bin/yq

    - name: Parse docker-compose.yaml for images
      id: parse_docker_compose
      run: |
        # 提取所有镜像并去重
        images=$(yq e '.services[].image' dify-repo/docker/docker-compose.yaml | sort -u | tr '\n' ' ')
        echo "Original images count: $(yq e '.services[].image' dify-repo/docker/docker-compose.yaml | wc -l)"
        echo "Unique images count: $(echo "$images" | wc -w)"
        echo "Unique Images: $images"
        echo "images_list=$images" >> $GITHUB_OUTPUT

    - name: Log in to Alibaba Cloud ACR
      run: echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_REGISTRY }} --username ${{ secrets.ACR_USERNAME }} --password-stdin

    - name: Install skopeo for image checking
      run: |
        sudo apt-get update
        sudo apt-get install -y skopeo

    - name: Enhanced image sync with parallel processing
      run: |
        images="${{ steps.parse_docker_compose.outputs.images_list }}"
        
        # 定义处理单个镜像的函数
        process_image() {
          local image=$1
          
          if [ -z "$image" ] || [ "$image" = "null" ]; then
            echo "Skipping empty or null image."
            return
          fi
          
          # 跳过无法从公共仓库拉取的镜像：
          # - vastdata/vastbase-vector: 需商业授权
          # - langgenius/dify-knowledge-fs-api: Dify 企业版组件，未发布到公共镜像仓库
          #   (https://github.com/langgenius/dify/issues/44719)
          case "$image" in
            vastdata/vastbase-vector*)
              echo "Skipping image (commercial license required): $image"
              return
              ;;
            langgenius/dify-knowledge-fs-api*)
              echo "Skipping image (enterprise-only, not published on Docker Hub): $image"
              return
              ;;
          esac
          
          echo "=== Processing image: $image ==="
          
          local acr_image
          if [[ "$image" == *@sha256:* ]]; then
            # docker tag/push 不接受 @sha256 摘要作为目标引用，
            # 按摘要拉取后改写成 tag 安全的命名（sha256-<摘要前12位>）再推送
            local base="${image%%@*}"
            local digest="${image##*@sha256:}"
            local repo_name="${base##*/}"
            acr_image="${{ secrets.ACR_REGISTRY }}/linjicong/$repo_name:sha256-${digest:0:12}"
          else
            acr_image="${{ secrets.ACR_REGISTRY }}/linjicong/${image##*/}"
          fi
          
          # 检查镜像是否存在且为 Docker schema2 格式（OCI 格式在 ACR 个人版控制台无法显示大小/镜像ID，
          # 发现 OCI 格式时强制重新同步以修复显示）
          local existing_manifest
          if existing_manifest=$(skopeo inspect --raw --creds "${{ secrets.ACR_USERNAME }}:${{ secrets.ACR_PASSWORD }}" "docker://$acr_image" 2>/dev/null) \
             && echo "$existing_manifest" | grep -q 'application/vnd\.docker\.distribution\.manifest'; then
            echo "✅ Image already exists in ACR (schema2): $acr_image"
            return
          fi
          
          echo "🔄 Image not found, syncing: $image -> $acr_image"
          
          # 执行同步操作：skopeo 直接跨仓库复制并转为 Docker schema2 格式。
          # 原因：runner 的 containerd 存储会把镜像以 OCI manifest 推送，
          # ACR 个人版控制台对 OCI manifest 解析不出大小/镜像ID（数据本身完整）；
          # --format v2s2 转成经典 schema2 后控制台可正常显示。
          #
          # 源候选回退链：GitHub runner 的共享 IP 常被 Docker Hub 匿名限流
          # （toomanyrequests；cr.weaviate.io 是 Docker Hub 的拉取代理，限流透传）。
          # Docker Hub 系源失败时回退 mirror.gcr.io（Google 的 Docker Hub 缓存，免认证）；
          # 配置了 DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets 时额外尝试带凭据的 docker.io 源。
          local candidates=("$image")
          if [[ "$image" == */* ]]; then
            local first="${image%%/*}"
            if [[ "$first" == *.* || "$first" == *:* || "$first" == "localhost" ]]; then
              case "$first" in
                docker.io|cr.weaviate.io)
                  local rest="${image#*/}"
                  [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ] && candidates+=("docker.io/$rest")
                  candidates+=("mirror.gcr.io/$rest")
                  ;;
              esac
            else
              # 无 registry 前缀的 org/image 形式（默认即 docker.io）
              [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ] && candidates+=("docker.io/$image")
              candidates+=("mirror.gcr.io/$image")
            fi
          else
            # 裸镜像名（默认 docker.io/library/<name>）
            [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ] && candidates+=("docker.io/library/$image")
            candidates+=("mirror.gcr.io/library/$image")
          fi
          
          local synced=0
          local src
          for src in "${candidates[@]}"; do
            local src_opts=()
            if [[ "$src" == docker.io/* && -n "${DOCKERHUB_USERNAME:-}" && -n "${DOCKERHUB_TOKEN:-}" ]]; then
              src_opts+=(--src-creds "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN")
            fi
            if skopeo copy --override-os linux --override-arch amd64 \
               --format v2s2 --retry-times 3 \
               "${src_opts[@]}" \
               --dest-creds "${{ secrets.ACR_USERNAME }}:${{ secrets.ACR_PASSWORD }}" \
               "docker://$src" "docker://$acr_image"; then
              echo "✅ Successfully synced: $acr_image (source: $src)"
              synced=1
              break
            fi
            echo "⚠️ Source failed, trying fallback: $src"
          done
          
          if [ "$synced" -eq 0 ]; then
            echo "❌ Failed to sync: $image (tried sources: ${candidates[*]})"
            echo "$image" >> "$RUNNER_TEMP/failed_images.txt"
          fi
        }
        
        export -f process_image
        export ACR_REGISTRY="${{ secrets.ACR_REGISTRY }}"
        export ACR_USERNAME="${{ secrets.ACR_USERNAME }}"
        export ACR_PASSWORD="${{ secrets.ACR_PASSWORD }}"
        # 可选：Docker Hub 凭据（仓库 Secrets 配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
        # 后自动启用，拉取走认证通道避开匿名限流；不配置则回退 mirror.gcr.io）
        export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
        export DOCKERHUB_TOKEN="${{ secrets.DOCKERHUB_TOKEN }}"
        
        # 并行处理镜像（限制并发数）
        echo "$images" | tr ' ' '\n' | xargs -I {} -P 2 bash -c 'process_image "$@"' _ {}
        
        # 汇总失败结果；有失败则让 Job 变红，避免问题被静默吞掉
        if [ -f "$RUNNER_TEMP/failed_images.txt" ]; then
          echo "::error::The following images failed to sync:"
          cat "$RUNNER_TEMP/failed_images.txt"
          exit 1
        fi
